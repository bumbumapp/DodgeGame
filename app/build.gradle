apply plugin: 'com.android.application'

// Huawei Ads (Petal) slot IDs for the AppGallery build: -PHMS_BANNER_ID=... or a gitignored ads.properties.
// Until the real slots are set the hms build falls back to Huawei's public test slots.
def hmsAdsProps = new Properties()
def hmsAdsFile = rootProject.file('ads.properties')
if (hmsAdsFile.exists()) hmsAdsFile.withInputStream { hmsAdsProps.load(it) }
def hmsAdId = { String key, String fallback -> ((project.findProperty(key) ?: hmsAdsProps.getProperty(key))?.toString()?.trim()) ?: fallback }
def HMS_TEST_BANNER_ID = 'testw6vs28auh3'
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_BANNER_ID = hmsAdId('HMS_BANNER_ID', HMS_TEST_BANNER_ID)
def HMS_INTERSTITIAL_ID = hmsAdId('HMS_INTERSTITIAL_ID', HMS_TEST_INTERSTITIAL_ID)
def HMS_TEST_REWARDED_ID = 'testx9dtjwj8hp'
def HMS_REWARDED_ID = hmsAdId('HMS_REWARDED_ID', HMS_TEST_REWARDED_ID)

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.dozingcatsoftware.dodge'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.dodgegamepro"
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName "2.0.0"
    }

    buildFeatures {
        resValues true
        buildConfig true
    }

    // play = Google Play (AdMob + UMP), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', HMS_BANNER_ID
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_banner_id', HMS_TEST_BANNER_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
            resValue 'string', 'hms_rewarded_id', HMS_REWARDED_ID
            resValue 'string', 'hms_test_rewarded_id', HMS_TEST_REWARDED_ID
        }
    }

    buildTypes {
        debug {
            // Google sample IDs: debug builds never request live ads.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_banner_id", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
            resValue "string", "admob_rewarded_id", "ca-app-pub-3940256099942544/5224354917"
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8444865753152507~3275521405"]
            resValue "string", "admob_banner_id", "ca-app-pub-8444865753152507/3539508618"
            resValue "string", "admob_interstitial_id", "ca-app-pub-8444865753152507/4177539531"
            resValue "string", "admob_rewarded_id", "ca-app-pub-8444865753152507/5566642821"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'androidx.work:work-runtime:2.11.0'
    implementation 'com.google.firebase:firebase-crashlytics'
    testImplementation 'junit:junit:4.13.2'
}
